name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check
      - run: cargo test

      - name: Build Windows test installer
        if: runner.os == 'Windows' && github.repository == 'kaceper11/monocode'
        timeout-minutes: 45
        run: npm run build:windows

      - name: Upload Windows test installer
        if: runner.os == 'Windows' && github.repository == 'kaceper11/monocode'
        uses: actions/upload-artifact@v4
        with:
          name: monocode-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
